<!DOCTYPE html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Quiz</title>
    <link rel="stylesheet" href="./Styles/Styles.css" />
    <link

          </button>

          </div>
        </div>
      </div>
    </nav>

      <div class="col-md-6 d-flex justify-content-center">
